[package]
name = "cc-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ccp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
cc-attest = { path = "../cc-attest" }
cc-hw = { path = "../cc-hw" }
cc-models = { path = "../cc-models" }
cc-proto = { path = "../cc-proto" }
cc-server = { path = "../cc-server" }
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "signal", "time"] }
toml = "0.8"

[dev-dependencies]
cc-attest = { path = "../cc-attest" }
cc-client = { path = "../cc-client" }
cc-proto = { path = "../cc-proto" }
hex.workspace = true
cc-models = { path = "../cc-models", features = ["testing"] }
tempfile = "3"
